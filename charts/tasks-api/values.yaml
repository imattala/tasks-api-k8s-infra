api:
  image:
    repository: tasks-api
    tag: dev
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50
  ingress:
    enabled: true
    className: nginx

postgres:
  image: postgres:16-alpine
  storage: 1Gi
  credentials:
    user: tasks
    password: tasks
    db: tasks
