apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-api
  labels:
    {{- include "tasks-api.labels" . | nindent 4 }}
    app: tasks-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: tasks-api
  template:
    metadata:
      labels:
        app: tasks-api
    spec:
      enableServiceLinks: false
      containers:
        - name: tasks-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: Never
          env:
            - name: POSTGRES_HOST
              value: postgres
          envFrom:
            - secretRef:
                name: postgres-credentials
          ports:
            - containerPort: 8000
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
